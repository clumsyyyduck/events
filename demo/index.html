<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<title>events — карта событий (демо)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Layout: full-screen map; filters float on top; mobile = draggable bottom sheet, desktop = left panel */
:root {
  --bg: #ffffff;
  --surface: #f4f5f9;
  --fg: #151826;
  --muted: #6a6f85;
  --line: #e3e5ee;
  --accent: #3346e0;
  --accent-fg: #ffffff;
  --ok: #1f8a4c;
  --warn: #c2410c;
  --shadow: 0 6px 24px rgba(21, 24, 38, .14);
  --display: "Unbounded", "Manrope", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  --topbar-h: 120px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12141c; --surface: #1c1f2b; --fg: #eef0f7; --muted: #9aa0b8; --line: #2b2f3f;
    --accent: #7b8cff; --accent-fg: #0d0f17; --ok: #4cc283; --warn: #fb923c;
    --shadow: 0 6px 24px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

#map { position: fixed; inset: 0; }

/* ---------- top bar ---------- */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.row1 { display: flex; gap: 8px; align-items: center; }
.seg { display: flex; background: var(--bg); border-radius: 12px; box-shadow: var(--shadow); padding: 3px; flex: none; }
.seg button { border: 0; background: none; padding: 7px 10px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; background: var(--bg); border-radius: 12px; box-shadow: var(--shadow); padding: 0 12px; height: 42px; }
.search input { border: 0; outline: 0; background: none; width: 100%; min-width: 0; font-size: 15px; }
.search svg { flex: none; color: var(--muted); }
.icon-btn { flex: none; width: 42px; height: 42px; border-radius: 12px; border: 0; background: var(--bg); box-shadow: var(--shadow); display: grid; place-items: center; position: relative; }
.icon-btn.primary { background: var(--accent); color: var(--accent-fg); }
.badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--warn); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; }

.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -12px; padding: 2px 12px 6px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid transparent; background: var(--bg); box-shadow: 0 2px 8px rgba(21,24,38,.12);
  padding: 7px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center;
}
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); }
.chip[aria-pressed="true"] { background: var(--c, var(--fg)); color: #fff; }
.chip[aria-pressed="true"] .dot { background: #fff; }
.chip.sub[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.chips.flat .chip { box-shadow: none; background: var(--surface); }
.chips.flat .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

.chip .x { margin-left: 2px; opacity: .75; font-size: 11px; }
.filter-btn { background: var(--fg); color: var(--bg); }
.filter-btn .count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-fg); font-size: 11px; font-weight: 800; display: inline-grid; place-items: center; }

.radio-row { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 14px 2px; font-size: 15px; font-weight: 600; text-align: left; }

/* ---------- category picker ---------- */
.picker-backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(10, 12, 20, .45); display: flex; align-items: flex-end; justify-content: center; }
.picker { background: var(--bg); width: 100%; max-width: 520px; max-height: 88%; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: var(--shadow); }
.picker-head { display: flex; justify-content: space-between; align-items: center; padding: 16px max(16px, env(safe-area-inset-left, 0px)) 8px; }
.picker-head h2 { font: 700 17px/1.2 var(--display); margin: 0; }
.picker .search { margin: 0 16px 8px; box-shadow: none; background: var(--surface); flex: none; }
.picker-list { overflow-y: auto; flex: 1; min-height: 0; padding: 0 8px 8px; overscroll-behavior: contain; }
.cat-row { display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 0; border-radius: 12px; }
.cat-main { flex: 1; min-width: 0; display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; border: 0; background: none; text-align: left; padding: 6px 8px; border-radius: 12px; }
.cat-main:hover { background: var(--surface); }
.cat-main b { display: block; font-size: 15px; }
.cat-main small, .sub-row small { color: var(--muted); font-size: 12.5px; }
.cat-ico { width: 44px; height: 44px; border-radius: 12px; background: var(--c); display: grid; place-items: center; font-size: 22px; }
.chev { color: var(--muted); font-size: 22px; line-height: 1; transition: transform .15s; }
.cat-main[aria-expanded="true"] .chev { transform: rotate(90deg); }
.check { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); background: var(--bg); display: grid; place-items: center; font-size: 14px; font-weight: 800; color: var(--accent-fg); padding: 0; }
.check.on, .check.some { background: var(--accent); border-color: var(--accent); }
.sub-list { padding: 2px 0 8px; }
.sub-row { width: 100%; display: grid; grid-template-columns: 28px 1fr auto 24px; gap: 10px; align-items: center; border: 0; background: none; text-align: left; padding: 9px 8px 9px 64px; border-radius: 10px; font-size: 14.5px; }
.sub-row:hover { background: var(--surface); }
.picker-foot { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
.picker-foot .primary { flex: 1; }
@media (min-width: 900px) { .picker-backdrop { align-items: center; } .picker { border-radius: 20px; max-height: 80%; } }

/* ---------- map pins ---------- */
.pin {
  border: 0; padding: 3px 9px 3px 3px; border-radius: 999px; background: var(--bg); color: var(--fg);
  display: flex; align-items: center; gap: 5px; box-shadow: 0 3px 10px rgba(21,24,38,.25);
  font: 700 12.5px/1 var(--body); white-space: nowrap;
}
.pin::after { content: ""; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%); border: 6px solid transparent; border-bottom: 0; border-top-color: var(--bg); }
.pin .ico { width: 24px; height: 24px; border-radius: 50%; background: var(--c); display: grid; place-items: center; font-size: 14px; }
.pin.full { opacity: .55; }
.pin.full .price { text-decoration: line-through; }
.pin.active { z-index: 3; background: var(--fg); color: var(--bg); padding: 5px 12px 5px 5px; font-size: 14px; }
.pin.active .ico { width: 30px; height: 30px; font-size: 18px; }
.pin.active::after { border-top-color: var(--fg); }
.pin.mine .ico { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ok); }
.maplibregl-ctrl-top-right { top: var(--topbar-h); }

/* ---------- sheet / panel ---------- */
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  height: calc(100% - 70px - env(safe-area-inset-top, 0px));
  background: var(--bg); border-radius: 20px 20px 0 0; box-shadow: 0 -6px 30px rgba(21,24,38,.18);
  display: flex; flex-direction: column; transition: transform .28s cubic-bezier(.2,.8,.2,1);
  will-change: transform;
}
.sheet.dragging { transition: none; }
.grab { padding: 8px max(16px, env(safe-area-inset-left, 0px)) 0; touch-action: none; flex: none; }
.handle { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 8px; }
.view { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.list-head h2 { font: 700 16px/1.2 var(--display); margin: 0; letter-spacing: -.01em; }
.list-head .muted { font-size: 13px; }
.muted { color: var(--muted); }
.link-btn { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 4px 0; }
.list-filters { margin: 10px -16px 2px; padding: 0 16px 8px; }

.card { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; }
.card:last-child { border-bottom: 0; }
.card .ico { width: 44px; height: 44px; border-radius: 12px; background: var(--c); display: grid; place-items: center; font-size: 22px; }
.card h3 { margin: 0 0 2px; font-size: 15px; font-weight: 700; line-height: 1.3; }
.card .meta { font-size: 13px; color: var(--muted); }
.card .price { font-weight: 800; font-size: 14px; white-space: nowrap; text-align: right; }
.card .spots { font-size: 12px; font-weight: 700; margin-top: 4px; text-align: right; white-space: nowrap; }
.card:hover h3 { color: var(--accent); }
.spots.low { color: var(--warn); }
.spots.none { color: var(--muted); }
.rating { font-weight: 700; color: var(--fg); }
.rating::before { content: "★ "; color: #f5a400; }
.empty { padding: 28px 8px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg); margin-bottom: 4px; }

/* detail */
.back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--muted); font-weight: 700; padding: 2px 0 8px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); }
.detail h1 { font: 700 21px/1.25 var(--display); margin: 10px 0 12px; letter-spacing: -.015em; text-wrap: balance; }
.facts { display: grid; gap: 8px; margin-bottom: 14px; }
.fact { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; }
.fact svg { flex: none; margin-top: 2px; color: var(--muted); }
.price-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px; border-radius: var(--r); background: var(--surface); margin-bottom: 14px; }
.price-row .big { font: 700 22px/1 var(--display); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 6px; width: 140px; max-width: 40vw; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.desc { margin: 0 0 18px; }
.section-title { font: 700 14px/1.2 var(--display); margin: 20px 0 10px; letter-spacing: -.01em; }
.org { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; }
.avatar { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 18px; color: #fff; background: var(--c, var(--accent)); }
.org-name { font-weight: 800; }
.org-stats { font-size: 13px; color: var(--muted); }
.review { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.review:last-child { border-bottom: 0; }
.review .who { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.review .who b { color: var(--fg); }
.stars { color: #f5a400; letter-spacing: 1px; }
.actions { position: sticky; bottom: calc(-24px - env(safe-area-inset-bottom, 0px)); margin: 18px -16px 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); display: grid; gap: 8px; }
.btn { border: 0; border-radius: 12px; padding: 13px 16px; font-weight: 800; font-size: 15px; display: inline-flex; gap: 8px; align-items: center; justify-content: center; text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.primary:disabled { background: var(--line); color: var(--muted); cursor: default; }
.btn.ghost { background: var(--surface); color: var(--fg); }
.btn.tg { background: #229ed9; color: #fff; }
.btn.vk { background: #0077ff; color: #fff; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.booked-box { border-radius: var(--r); padding: 14px; background: color-mix(in srgb, var(--ok) 13%, transparent); color: var(--fg); margin-bottom: 4px; }
.booked-box b { color: var(--ok); }
.stepper { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.stepper .ctrl { display: flex; align-items: center; gap: 4px; background: var(--surface); border-radius: 12px; padding: 4px; }
.stepper .ctrl button { width: 36px; height: 36px; border: 0; border-radius: 9px; background: var(--bg); font-size: 18px; font-weight: 800; }
.stepper .ctrl span { min-width: 28px; text-align: center; font-weight: 800; }
.mini-list .card { padding: 10px 0; }
.note { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

/* form */
.form { display: grid; gap: 12px; }
.field { display: grid; gap: 5px; }
.field label { font-size: 13px; font-weight: 700; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 12px; font-size: 15px; }
.field textarea { resize: vertical; min-height: 80px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.pick-banner {
  position: fixed; z-index: 7; left: 50%; transform: translateX(-50%); top: calc(var(--topbar-h) + 8px);
  background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 12px; box-shadow: var(--shadow);
  display: flex; gap: 12px; align-items: center; font-weight: 700; font-size: 14px; width: max-content; max-width: calc(100% - 24px);
}
.pick-banner button { border: 0; background: none; color: inherit; opacity: .7; font-weight: 700; }
.toast { position: fixed; z-index: 9; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; transition: .25s; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.demo-flag { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* ---------- desktop ---------- */
@media (min-width: 900px) {
  .sheet { top: 0; bottom: 0; height: auto; width: 420px; right: auto; border-radius: 0; transform: none !important; box-shadow: 4px 0 30px rgba(21,24,38,.12); }
  .handle { display: none; }
  .grab { padding-top: 16px; }
  .topbar { left: 420px; }
  .pick-banner { left: calc(50% + 210px); }
  .toast { left: calc(50% + 210px); }
}
@media (prefers-reduced-motion: reduce) { .sheet, .toast { transition: none; } }
</style>
</head>
<body>
<div id="map"></div>

<header class="topbar" id="topbar">
  <div class="row1">
    <button class="icon-btn" id="btn-settings" aria-label="Настройки">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    </button>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Волейбол, керамика, квиз…" autocomplete="off">
    </label>
    <button class="icon-btn" id="btn-mine" aria-label="Мои записи">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="17" rx="3"/><path d="M8 2v4M16 2v4M4 10h16M9 15l2 2 4-4"/></svg>
      <span class="badge" id="mine-badge" hidden>0</span>
    </button>
    <button class="icon-btn primary" id="btn-create" aria-label="Создать событие">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
  <div class="chips" id="cats" role="group" aria-label="Категории"></div>
</header>

<div class="picker-backdrop" id="picker" hidden>
  <div class="picker" role="dialog" aria-modal="true" aria-labelledby="picker-title">
    <div class="picker-head"><h2 id="picker-title">Категории</h2><button class="link-btn" id="picker-close">Закрыть</button></div>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="picker-q" type="search" placeholder="Найти вид: падел, керамика…" autocomplete="off">
    </label>
    <div class="picker-list" id="picker-list"></div>
    <div class="picker-foot"><button class="btn ghost" id="picker-reset">Сбросить</button><button class="btn primary" id="picker-apply">Показать</button></div>
  </div>
</div>

<section class="sheet" id="sheet" aria-label="События">
  <div class="grab" id="grab"><div class="handle"></div></div>
  <div class="view" id="view"></div>
</section>

<div class="pick-banner" id="pick-banner" hidden>
  <span>Нажмите на карту, где пройдёт событие</span>
  <button id="pick-cancel">Отмена</button>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// ---------- справочники ----------
// категории и виды — по docs/10-categories.md
const CATS = {
  sport:    { name: 'Спорт',            color: '#e8590c', icon: '🏅' },
  body:     { name: 'Тело и практики',  color: '#c2255c', icon: '🧘' },
  dance:    { name: 'Танцы',            color: '#e64980', icon: '💃' },
  creative: { name: 'Творчество',       color: '#7048e8', icon: '🎨' },
  games:    { name: 'Игры',             color: '#1971c2', icon: '🎲' },
  culture:  { name: 'Культура',         color: '#0c8599', icon: '🎭' },
  learn:    { name: 'Обучение',         color: '#e8a400', icon: '🎓' },
  social:   { name: 'Общение',          color: '#4263eb', icon: '💬' },
  food:     { name: 'Еда и напитки',    color: '#e03131', icon: '🍽️' },
  outdoor:  { name: 'На природе',       color: '#2f9e44', icon: '🌲' },
};
const SUBS = {

// ---------- нижняя шторка ----------
const sheet = $('#sheet');
const isDesktop = () => matchMedia('(min-width: 900px)').matches;
let sheetPos = 'peek';
function sheetOffset(pos) {
  const h = sheet.offsetHeight;
  const visible = { peek: 168, half: Math.round(innerHeight * .52), full: h }[pos];
  return Math.max(0, h - visible);
}
function setSheet(pos) {
  sheetPos = pos;
  if (isDesktop()) { sheet.style.transform = ''; return; }
  sheet.style.transform = `translateY(${sheetOffset(pos)}px)`;
}
(() => {
  const grab = $('#grab'); let y0 = 0, t0 = 0, dragging = false;
  grab.addEventListener('pointerdown', e => {
    if (isDesktop()) return;
    dragging = true; y0 = e.clientY; t0 = sheetOffset(sheetPos);
    sheet.classList.add('dragging'); grab.setPointerCapture(e.pointerId);
  });
  grab.addEventListener('pointermove', e => {
    if (!dragging) return;
    sheet.style.transform = `translateY(${Math.max(0, t0 + e.clientY - y0)}px)`;
  });
  grab.addEventListener('pointerup', e => {
    if (!dragging) return;
    dragging = false; sheet.classList.remove('dragging');
    const dy = e.clientY - y0;
    if (Math.abs(dy) < 6) { setSheet(sheetPos === 'peek' ? 'half' : sheetPos === 'half' ? 'full' : 'half'); return; }
    const cur = t0 + dy;
    const best = ['peek', 'half', 'full'].sort((a, b) => Math.abs(sheetOffset(a) - cur) - Math.abs(sheetOffset(b) - cur))[0];
    setSheet(best);
  });
})();
addEventListener('resize', () => setSheet(sheetPos));

      Напишите организатору, чтобы оплатить и уточнить детали. Переписка идёт в Telegram или VK, не здесь.</div>
      ${contacts}
      <button class="btn ghost" id="cancel-booking">Отменить запись</button>`;
  } else if (l <= 0) {
    action = `<button class="btn primary" disabled>Мест нет</button><button class="btn ghost" id="waitlist">Сообщить, если место освободится</button>`;
  } else {
    action = `<div class="stepper"><span>Сколько мест?</span>
        <span class="ctrl"><button id="minus" aria-label="Меньше">−</button><span id="seats">1</span><button id="plus" aria-label="Больше">+</button></span></div>
      <button class="btn primary" id="book">Забронировать · ${rub(ev.price)}</button>
      <div class="note" style="text-align:center;margin:0">Оплата — напрямую организатору после записи</div>`;
  }
  $('#view').innerHTML = `<article class="detail" style="--c:${c.color}">
    <button class="back" id="back">‹ Все события</button>
    <span class="tag">${SUBS[ev.sub][2]} ${c.name} · ${SUBS[ev.sub][1]}</span>
    <h1>${esc(ev.title)}</h1>
    <div class="facts">
      <div class="fact">${ICON.cal}<span><b>${dayLabel(ev.off)}</b>, ${dateOf(ev.off).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })}, ${ev.time}</span></div>
      <div class="fact">${ICON.clock}<span>${durText(ev.dur)}</span></div>
      <div class="fact">${ICON.pin}<span>${esc(ev.place)} · <a href="https://yandex.ru/maps/?rtext=~${ev.lat},${ev.lng}&rtt=auto" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700">Маршрут</a></span></div>
    </div>
    <div class="price-row">
      <div><div class="big">${rub(ev.price)}</div><div class="muted" style="font-size:13px">за человека</div></div>
      <div style="text-align:right"><b>${l > 0 ? `Осталось ${l} из ${ev.cap}` : `Все ${ev.cap} мест заняты`}</b><div class="bar"><i style="width:${pct}%"></i></div></div>
    </div>
    <p class="desc">${esc(ev.desc)}</p>

    <div class="section-title">Организатор</div>
    <div class="org">
      <div class="avatar" style="--c:${c.color}">${initials(o.name)}</div>
      <div><div class="org-name">${esc(o.name)}</div>
        <div class="org-stats">${esc(o.about)}</div>
        <div class="org-stats">${o.rating ? `<span class="rating">${o.rating.toFixed(1)}</span> · ${o.reviews} ${plural(o.reviews, 'отзыв', 'отзыва', 'отзывов')} · ${o.held} ${plural(o.held, 'событие', 'события', 'событий')} проведено` : 'Пока нет отзывов'}</div>
      </div>
    </div>
    ${reviews.length ? `<div class="section-title">Отзывы</div>` + reviews.map(r => `<div class="review">
        <div class="who"><span><b>${r[0]}</b> · ${esc(r[2])}</span><span class="stars">${'★'.repeat(r[1])}${'☆'.repeat(5 - r[1])}</span></div>${esc(r[3])}</div>`).join('') : ''}
    ${more.length ? `<div class="section-title">Ещё у организатора</div><div class="mini-list">${more.map(cardHTML).join('')}</div>` : ''}
    ${!mine && (o.tg || o.vk) ? `<div class="section-title">Вопрос до записи?</div>${contacts}` : ''}
    <div class="actions">${action}</div>
  </article>`;
  $('#view').scrollTop = 0;
}
$('#view').addEventListener('click', e => {
  if (state.view !== 'detail') return;
  const ev = EVENTS.find(x => x.id === state.active); if (!ev) return;
  const t = e.target;
  if (t.closest('#back')) return closeDetail();
  if (t.closest('#minus')) { seats = Math.max(1, seats - 1); $('#seats').textContent = seats; return; }
  if (t.closest('#plus')) { seats = Math.min(left(ev), 4, seats + 1); $('#seats').textContent = seats; return; }
  if (t.closest('#book')) {
    bookings[ev.id] = seats; store.set('bookings', bookings);
    toast('Место забронировано'); afterChange(ev); return;
  }
  if (t.closest('#cancel-booking')) {
    delete bookings[ev.id]; store.set('bookings', bookings);
    toast('Запись отменена'); afterChange(ev); return;
  }
  if (t.closest('#waitlist')) { toast('Сообщим, если место освободится'); return; }
  const ct = t.closest('[data-contact]');
  if (ct) { e.preventDefault(); toast(`В рабочей версии откроется ${ct.dataset.contact}`); }
});
function afterChange(ev) { updatePins(); updateBadge(); renderDetail(ev); }

// ---------- мои записи ----------
function updateBadge() {
  const n = Object.keys(bookings).length;
  $('#mine-badge').hidden = !n; $('#mine-badge').textContent = n;
}
$('#btn-mine').onclick = () => {
  state.view = 'mine'; state.active = null; updatePins();
  const booked = EVENTS.filter(e => bookings[e.id]).sort((a, b) => a.off - b.off);
  const mine = EVENTS.filter(e => e.org === 'me');
  $('#view').innerHTML = `<button class="back" id="back-mine">‹ Все события</button>
    <div class="list-head"><h2>Мои записи</h2></div>
    ${booked.length ? booked.map(cardHTML).join('') : '<div class="empty"><b>Пока нет записей</b>Выберите событие на карте и нажмите «Забронировать».</div>'}
    <div class="list-head" style="margin-top:18px"><h2>Я организую</h2></div>
    ${mine.length ? mine.map(cardHTML).join('') : '<div class="empty"><b>Вы ещё ничего не создали</b>Нажмите «+» вверху, чтобы собрать людей на своё событие.</div>'}`;
  if (!isDesktop()) setSheet('full');
};

// ---------- создание события ----------
$('#btn-create').onclick = () => {
  state.view = 'create'; state.active = null; updatePins();
  const catOpts = Object.entries(CATS).map(([k, c]) => `<option value="${k}">${c.name}</option>`).join('');
  $('#view').innerHTML = `<button class="back" id="back-create">‹ Все события</button>
    <div class="list-head"><h2>Новое событие</h2></div>
    <p class="muted" style="margin:6px 0 14px;font-size:14px">Заполните карточку, потом укажите место на карте.</p>
    <form class="form" id="create-form">
      <div class="two">
        <div class="field"><label for="f-cat">Категория</label><select id="f-cat">${catOpts}</select></div>
        <div class="field"><label for="f-sub">Вид</label><select id="f-sub"></select></div>
      </div>
      <div class="field"><label for="f-title">Название</label><input id="f-title" required value="Волейбол: вечерняя игра" maxlength="80"></div>
      <div class="two">
        <div class="field"><label for="f-date">Дата</label><input id="f-date" type="date" required></div>
        <div class="field"><label for="f-time">Время</label><input id="f-time" type="time" required value="19:00"></div>
      </div>
      <div class="two">
        <div class="field"><label for="f-price">Цена, ₽</label><input id="f-price" type="number" min="0" step="50" required value="600"></div>
        <div class="field"><label for="f-cap">Мест</label><input id="f-cap" type="number" min="1" max="500" required value="12"></div>
      </div>
      <div class="field"><label for="f-place">Место</label><input id="f-place" required value="Спортзал, 2 этаж"></div>
      <div class="field"><label for="f-desc">Описание</label><textarea id="f-desc">Играем 6×6, средний уровень. Мячи есть.</textarea></div>
      <div class="field"><label for="f-tg">Ваш Telegram для связи</label><input id="f-tg" placeholder="@username"></div>
      <button class="btn primary" type="submit">Указать место на карте</button>
    </form>`;
  const fillSubs = () => { const cat = $('#f-cat').value; $('#f-sub').innerHTML = Object.entries(SUBS).filter(([, s]) => s[0] === cat).map(([k, s]) => `<option value="${k}">${s[1]}</option>`).join(''); };
  $('#f-cat').onchange = fillSubs; fillSubs();
  const d = dateOf(1); $('#f-date').value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  $('#create-form').onsubmit = e => {
    e.preventDefault();
    const [y, m, dd] = $('#f-date').value.split('-').map(Number);
    const off = Math.round((new Date(y, m - 1, dd) - today) / 864e5);
    state.draft = {
      id: 'u' + Date.now(), city: state.city, sub: $('#f-sub').value, cat: $('#f-cat').value, title: $('#f-title').value.trim() || 'Без названия',
      off: Math.max(0, off), time: $('#f-time').value, dur: 120, price: Math.max(0, +$('#f-price').value || 0), cap: Math.max(1, +$('#f-cap').value || 1),
      booked: 0, place: $('#f-place').value.trim(), org: 'me', desc: $('#f-desc').value.trim(),
    };
    const tg = $('#f-tg').value.trim().replace(/^@/, '');
    if (tg) ORGS.me.tg = tg;
    state.picking = true; $('#pick-banner').hidden = false;
    if (!isDesktop()) setSheet('peek');
  };
  if (!isDesktop()) setSheet('full');
};
function finishCreate(lngLat) {
  state.picking = false; $('#pick-banner').hidden = true;
  const ev = Object.assign(state.draft, { lat: +lngLat.lat.toFixed(5), lng: +lngLat.lng.toFixed(5) });
  state.draft = null;
  EVENTS.push(ev); created.push(ev); store.set('created', created); store.set('me-tg', ORGS.me.tg);
  pinFor(ev); toast('Событие опубликовано'); openDetail(ev.id);
}
$('#pick-cancel').onclick = () => { state.picking = false; state.draft = null; $('#pick-banner').hidden = true; renderList(); };
ORGS.me.tg = store.get('me-tg', '');
$('#view').addEventListener('click', e => { if (e.target.closest('#back-mine, #back-create, #back-settings')) { state.view = 'list'; renderList(); } });

// ---------- запуск ----------
function refresh() {
  updatePins();
  if (state.view === 'detail' && state.active) { const ev = EVENTS.find(e => e.id === state.active); if (ev && matches(ev)) return; state.active = null; updatePins(); }
  renderList();
}
renderCats(); updateBadge();
setSheet('peek');
map.on('load', refresh);
renderList();
</script>
</body>
</html>
